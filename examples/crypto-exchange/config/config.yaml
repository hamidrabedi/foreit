database:
  driver: postgres
  host: localhost
  port: 5432
  user: "postgres"
  password: "123"
  name: crypto_exchange
  sslmode: disable
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 300

server:
  host: localhost
  port: 8000
  read_timeout: 30
  write_timeout: 30
  idle_timeout: 120
  max_header_bytes: 1048576
  health_check_path: /health

admin:
  enabled: true
  path: /admin/
  title: Forge Crypto Exchange Admin

api:
  enabled: true
  path: /api/v1/
  default_page_size: 20
  max_page_size: 100

security:
  session_secret: change-me-in-production-with-random-string
  csrf_secret_key: change-me-in-production-with-random-string
  csrf_exempt_paths:
    - /api

logging:
  level: info
  format: json
  output: stdout
