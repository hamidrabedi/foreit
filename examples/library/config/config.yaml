# Library Management System Configuration

# Application configuration
app:
  name: "Library Management"
  env: "development"
  debug: true
  version: "0.1.0"

# Server configuration
server:
  host: "localhost"
  port: "8000"
  read_timeout: 30
  write_timeout: 30

# Database configuration - SQLite3
database:
  driver: "sqlite3"
  name: "library.db"

# Admin configuration
admin:
  enabled: true
  path: "/admin/"
  title: "Library Admin"
  header_title: "Library Management System"
  site_name: "Library"

# Security configuration
security:
  secret_key: "library-secret-key-change-in-production"
  csrf_secret_key: "library-csrf-secret-change-in-production"
  session_secret: "library-session-secret-change-in-production"
