{{define "filter_sidebar"}}
<div class="filter-sidebar">
    <h3 class="filter-title">Filter</h3>
    {{range .}}
    <div class="filter-group">
        <h4 class="filter-group-label">{{.Label}}</h4>
        <ul class="filter-options">
            <li class="{{if not .Value}}active{{end}}">
                <a href="?{{strip_param $.Request .Name}}">All</a>
            </li>
            {{range .Options}}
            <li class="{{if .Selected}}active{{end}}">
                <a href="?{{set_param $.Request $.Name .Value}}">{{.Label}}</a>
            </li>
            {{end}}
        </ul>
    </div>
    {{end}}
</div>
{{end}}
