{{define "history"}}
<div class="admin-history">
    <div class="header">
        <h2>History: {{.ModelName}} #{{.InstanceID}}</h2>
    </div>

    <div class="content">
        <table class="table history-table">
            <thead>
                <tr>
                    <th>Date/Time</th>
                    <th>User</th>
                    <th>Action</th>
                    <th>Description</th>
                </tr>
            </thead>
            <tbody>
                {{if .History}}
                {{range .History}}
                <tr>
                    <td>{{.Timestamp.Format "Jan 02, 2006 15:04"}}</td>
                    <td>{{.UserName}}</td>
                    <td>
                        <span class="badge badge-{{.ActionClass}}">{{.Action}}</span>
                    </td>
                    <td>{{.Description}}</td>
                </tr>
                {{end}}
                {{else}}
                <tr>
                    <td colspan="4" class="empty">No history available for this object.</td>
                </tr>
                {{end}}
            </tbody>
        </table>
    </div>
</div>
{{end}}
