{{define "inline_tabular"}}
<div class="inline-group inline-tabular">
    <h3 class="inline-title">{{.Name}}</h3>
    
    <div class="inline-table-container">
        <table class="inline-table">
            <thead>
                <tr>
                    <th class="delete-column"></th>
                    {{range .Fields}}
                        <th>{{.Label}}</th>
                    {{end}}
                </tr>
            </thead>
            <tbody class="inline-forms">
                {{range .Instances}}
                    <tr class="inline-form-row">
                        <td class="delete-column">
                            <input type="checkbox" name="{{$.Name}}-DELETE" value="{{.ID}}">
                        </td>
                        {{range $.Fields}}
                            <td>
                                <input type="text" name="{{$.Name}}-{{.Name}}" value="{{.Value}}" class="form-control">
                            </td>
                        {{end}}
                    </tr>
                {{end}}
                {{range .ExtraForms}}
                    <tr class="inline-form-row empty-form">
                        <td class="delete-column"></td>
                        {{range $.Fields}}
                            <td>
                                <input type="text" name="{{$.Name}}-{{.Name}}" class="form-control">
                            </td>
                        {{end}}
                    </tr>
                {{end}}
            </tbody>
        </table>
    </div>
    
    {{if .CanAddMore}}
        <button type="button" class="btn btn-sm btn-add-inline" onclick="addInlineForm('{{.Name}}')">
            Add another {{.Name}}
        </button>
    {{end}}
</div>
{{end}}
