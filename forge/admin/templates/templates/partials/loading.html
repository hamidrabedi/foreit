{{define "loading"}}
<div class="admin-loading">
    <div class="loading-spinner">
        <div class="spinner"></div>
        <p class="loading-message">{{.Message | default "Loading..."}}</p>
    </div>
</div>
{{end}}

{{define "skeleton"}}
<div class="skeleton-loader">
    {{if .Lines}}
    {{range .Lines}}
    <div class="skeleton-line" style="width: {{.Width}}%; height: {{.Height}}px; margin-bottom: {{.Margin}}px;"></div>
    {{end}}
    {{else}}
    <div class="skeleton-line" style="width: 100%; height: 20px; margin-bottom: 10px;"></div>
    <div class="skeleton-line" style="width: 80%; height: 20px; margin-bottom: 10px;"></div>
    <div class="skeleton-line" style="width: 90%; height: 20px;"></div>
    {{end}}
</div>
{{end}}
