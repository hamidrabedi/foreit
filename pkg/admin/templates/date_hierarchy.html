{{define "date_hierarchy"}}
{{if .Show}}
<nav class="toplinks" aria-labelledby="date-hierarchy-label">
    <span id="date-hierarchy-label">Filter by {{.FieldName}}</span>
    {{if .Back}}
    <a href="{{.Back.Link}}" class="date-back">‹ {{.Back.Title}}</a>
    {{end}}
    {{range .Choices}}
    {{if .Link}}
    <a href="{{.Link}}">{{.Title}}</a>
    {{else}}
    {{.Title}}
    {{end}}
    {{end}}
</nav>
{{end}}
{{end}}
