{{define "filter"}}
<details data-filter-title="{{.Title}}"{{if .Open}} open{{end}}>
    <summary>By {{.Title}}</summary>
    <ul>
        {{range .Choices}}
        <li{{if .Selected}} class="selected"{{end}}>
            <a href="{{.QueryString}}">{{.Display}}</a>
        </li>
        {{end}}
    </ul>
</details>
{{end}}
