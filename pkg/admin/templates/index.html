{{define "index"}}
{{template "base" .}}
{{end}}

{{define "content"}}
<h1>Welcome, {{.Username}}!</h1>

<div class="dashboard">
    <h2>Models</h2>
    <div class="model-list">
        {{if .Models}}
        <ul>
            {{range .Models}}
            <li>
                <a href="/admin/{{.Name}}/">{{.VerboseName}}</a>
                {{if .Count}}
                <span class="count">({{.Count}})</span>
                {{end}}
            </li>
            {{end}}
        </ul>
        {{else}}
        <p>No models registered yet.</p>
        {{end}}
    </div>
</div>
{{end}}
