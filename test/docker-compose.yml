services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: etemademan
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: etemademan_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
